<style>.mermaid-output { margin: 1em 0; overflow-x: auto; } .mermaid-output svg { max-width: 100%; height: auto; }</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  (function() {
    var meta = document.querySelector('meta[name=color-scheme]');
    var isDark = meta && (meta.getAttribute('content') === 'dark' || (meta.getAttribute('content') === 'light dark' && window.matchMedia('(prefers-color-scheme: dark)').matches));
    mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default' });
    var blocks = document.querySelectorAll('pre > code.language-mermaid');
    blocks.forEach(function(code, i) {
      var pre = code.parentElement;
      var definition = code.textContent;
      var id = 'mermaid-' + i + '-' + Date.now();
      mermaid.render(id, definition).then(function(result) {
        var div = document.createElement('div');
        div.className = 'mermaid-output';
        div.innerHTML = result.svg;
        if (result.bindFunctions) result.bindFunctions(div);
        pre.parentNode.replaceChild(div, pre);
      }).catch(function(err) {
        console.error('Mermaid render error:', err);
      });
    });
  })();
</script>
